name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign the APK'
        required: false
        default: 'true'
        type: boolean

jobs:
  # ── Signed release APK + AAB ───────────────────────────────────────────────
  release:
    name: Build & sign release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # needed to create GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── Decode keystore from secret (base64) ────────────────────────────────
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/aura.keystore

      # ── Run tests before releasing ──────────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew test --no-daemon
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"

      # ── Build release APK (signed when keystore secret is set) ─────────────
      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/aura.keystore', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── Build release AAB (for Play Store) ─────────────────────────────────
      - name: Bundle release AAB
        run: ./gradlew :app:bundleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/aura.keystore', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── Extract version from tag ────────────────────────────────────────────
      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # ── Rename outputs ──────────────────────────────────────────────────────
      - name: Rename outputs
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/aura-${TAG}.apk
          mv app/build/outputs/bundle/release/app-release.aab \
             app/build/outputs/bundle/release/aura-${TAG}.aab

      # ── Upload APK + AAB as artifacts ───────────────────────────────────────
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aura-release-${{ steps.version.outputs.tag }}
          path: |
            app/build/outputs/apk/release/aura-*.apk
            app/build/outputs/bundle/release/aura-*.aab
          retention-days: 90

      # ── Create GitHub Release ───────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Aura ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: |
            app/build/outputs/apk/release/aura-*.apk
            app/build/outputs/bundle/release/aura-*.aab
